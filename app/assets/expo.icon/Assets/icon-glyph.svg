<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  fill="none"
>
  <title>Pocketful pocket-and-pass app glyph</title>
  <desc>
    A single-color Apple app icon glyph: an identity pass rising from a soft,
    rounded pocket. Designed for import as a foreground layer in Icon Composer.
  </desc>

  <defs>
    <mask id="pass-cutouts" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="white" />

      <!-- Pass portrait and information lines become transparent cutouts. -->
      <circle cx="421" cy="279" r="53" fill="black" />
      <rect x="500" y="241" width="136" height="28" rx="14" fill="black" />
      <rect x="500" y="291" width="96" height="24" rx="12" fill="black" />

      <!-- Small side notches make the emerging card read as a Wallet pass. -->
      <circle cx="310" cy="381" r="20" fill="black" />
      <circle cx="714" cy="381" r="20" fill="black" />
    </mask>
  </defs>

  <g fill="#F8FBFF" mask="url(#pass-cutouts)">
    <!-- The pass sits behind the pocket. -->
    <rect x="310" y="116" width="404" height="574" rx="108" />

    <!-- A deep, friendly pocket with a curved opening and shield-like base. -->
    <path d="M142 405C300 539 724 539 882 405L826 735C808 844 676 904 512 904C348 904 216 844 198 735L142 405Z" />
  </g>
</svg>
